<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blurpy</title>
<meta name="description" content="Blurpy — coming soon.">

<meta property="og:title" content="Blurpy">
<meta property="og:description" content="Blurpy — coming soon.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://blurpy.app">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">

<style>
  :root {
    --bg: #ffffff;
    --fg: #101014;
    --muted: #6b6b76;
    --accent: #4f46e5;
    --border: #e6e6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0f;
      --fg: #f2f2f5;
      --muted: #9a9aa6;
      --accent: #8b85ff;
      --border: #22222c;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
  }

  main {
    width: 100%;
    max-width: 34rem;
    text-align: center;
  }

  .mark {
    width: 72px;
    height: 72px;
    margin: 0 auto 1.75rem;
    border-radius: 20px;
    background: linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 45%, #ff7ab8));
    display: grid;
    place-items: center;
    font-size: 2rem;
    box-shadow: 0 12px 32px -12px color-mix(in srgb, var(--accent) 70%, transparent);
  }

  h1 {
    margin: 0 0 0.75rem;
    font-size: clamp(2.25rem, 8vw, 3.25rem);
    letter-spacing: -0.03em;
    font-weight: 650;
  }

  .tagline {
    margin: 0 auto 2.25rem;
    max-width: 26rem;
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--muted);
  }

  .badge {
    display: inline-block;
    padding: 0.4rem 0.85rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 0.8125rem;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  footer {
    margin-top: 3.5rem;
    font-size: 0.8125rem;
    color: var(--muted);
  }
  footer a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--border); }
  footer a:hover { color: var(--fg); }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🫧</div>

    <!-- EDIT: başlık -->
    <h1>Blurpy</h1>

    <!-- EDIT: tek cümlelik açıklama -->
    <p class="tagline">
      Something new is being built here.
    </p>

    <span class="badge">Coming soon</span>

    <footer>
      <!-- EDIT: iletişim -->
      <a href="mailto:hello@blurpy.app">hello@blurpy.app</a>
    </footer>
  </main>
</body>
</html>
